spring.application.name=control-plane
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ff_platform
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update

# GCP Pub/Sub Configuration
spring.cloud.gcp.pubsub.project-id=my-gcp-project
app.pubsub.topic-name=flag-updates

# Logging
logging.level.com.ffplatform=DEBUG
