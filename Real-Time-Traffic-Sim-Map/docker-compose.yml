services:
  redis:
    image: redis:7-alpine
    container_name: traffic-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  simulator:
    build: 
      context: ./simulator
    container_name: traffic-simulator
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SIMULATION_AREA=Howrah
    depends_on:
      redis:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: traffic-backend
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
