server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Spring Boot services running locally
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

        - id: chat-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/chat/**

        - id: chat-ws
          uri: ws://localhost:8082
          predicates:
            - Path=/ws-chat/**

        # AI service running in Docker (port 8000 exposed on host)
        - id: ai-service
          uri: http://localhost:8000
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - RewritePath=/api/v1/ai/(?<segment>.*), /${segment}

        - id: scheduler-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/scheduler/**

logging:
  level:
    org.springframework.cloud.gateway: INFO
