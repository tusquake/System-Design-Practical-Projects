services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cricstream
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d cricstream"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cricstream-network
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  redis:
    image: redis:alpine
    networks:
      - cricstream-network
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  backend:
    image: cricstream-backend:latest
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://user:password@db:5432/cricstream
    networks:
      - cricstream-network
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  simulator:
    image: cricstream-simulator:latest
    environment:
      - BACKEND_URL=http://backend:8000
      - GROQ_API_KEY=${GROQ_API_KEY}
    networks:
      - cricstream-network
    deploy:
      replicas: 1 # Only 1 simulator to prevent duplicate events
      restart_policy:
        condition: on-failure

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cricstream-network
    depends_on:
      - backend
    deploy:
      replicas: 2

networks:
  cricstream-network:
    driver: overlay # Required for Docker Swarm

volumes:
  postgres_data:
